[project]
name = "dbt-bootcamp"
version = "1.11.0"
description = "dbt bootcamp project using prepared airbnb data"
readme = "README.md"
authors = [
    { name = "parnamijanesh-creator", email = "parnamijanesh@gmail.com" }
]

requires-python = ">=3.10,<3.14"
dependencies = [
    "dbt-core~=1.11.0",
    "dbt-snowflake~=1.11.0",
    "dbt-autofix~=0.18.0",
    "dagster-dbt~=0.28.0",
    "dagster-webserver~=1.12.0",
]

[project.scripts]
dbt-bootcamp = "dbt_bootcamp:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
