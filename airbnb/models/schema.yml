models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_host')
                field: host_id
      - name: room_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Entire home/apt
                  - Private room
                  - Hotel room
                  - Shared room
      - name: minimum_nights
        description: "{{ doc('dim_listings_minimum_nights') }}"
        data_tests:
          - positive_values
  
  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
      
      - name: host_name
        data_type: string
        constraints:
          - type: not_null
      
      - name: is_superhost
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        data_type: timestamp

      - name: created_at
        data_type: timestamp

  - name: fct_reviews
    columns:
      - name: review_text
        data_tests:
          - not_null
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      